# Plain Kustomize file listing every manifest in the "apps" layer. postgres-secret.yaml is
# SOPS-encrypted ciphertext (see apps.yaml one level up for how Flux decrypts it); every
# other file here is ordinary plaintext.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - demo-app.yaml
  - postgres-secret.yaml
  - gateway.yaml
  - network-policies.yaml
  - pdb.yaml
  - postgres-backup.yaml
