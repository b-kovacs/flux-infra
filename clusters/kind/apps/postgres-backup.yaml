apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-pvc
  namespace: default
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: default
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: pg-dump
              image: postgres:17
              envFrom:
                - secretRef:
                    name: postgres-secret
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  FILE="/backup/${POSTGRES_DB}-$(date -u +%Y%m%dT%H%M%SZ).dump"
                  pg_dump -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -F c -f "$FILE"
                  echo "wrote $FILE"
                  # keep the 7 most recent dumps
                  cd /backup && ls -1t "${POSTGRES_DB}"-*.dump | tail -n +8 | xargs -r rm -f
                  ls -la /backup
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: postgres-backup-pvc
