apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: image-automation
  namespace: flux-system
spec:
  interval: 1m
  dependsOn:
    - name: apps
  path: ./clusters/kind/image-automation
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
