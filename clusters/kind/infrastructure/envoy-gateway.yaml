apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 1h
  url: oci://docker.io/envoyproxy/gateway-helm
  ref:
    tag: v1.9.1
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m                          # CHANGED: was absent (defaulted to 5m)
  targetNamespace: envoy-gateway-system
  install:
    createNamespace: true
    remediation:                        # CHANGED: added — retry failed installs
      retries: 3
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
