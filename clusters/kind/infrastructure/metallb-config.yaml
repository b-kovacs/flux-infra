apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: kind-pool
  namespace: metallb-system
spec:
  addresses:
    - 10.4.1.200-10.4.1.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
