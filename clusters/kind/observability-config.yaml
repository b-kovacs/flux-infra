# Separate layer for anything that needs the CRDs kube-prometheus-stack installs
# (ServiceMonitor, PrometheusRule, ...) - bundling this with the HelmRelease itself
# causes a dry-run deadlock (the CRD doesn't exist yet when this config is validated).
# Same pattern as metallb-config vs. metallb's HelmRelease.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-config
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: observability
  path: ./clusters/kind/observability-config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
