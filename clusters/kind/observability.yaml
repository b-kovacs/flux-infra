apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  dependsOn:
    - name: infrastructure
  path: ./clusters/kind/observability
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
