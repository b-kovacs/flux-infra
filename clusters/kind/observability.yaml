# Installs kube-prometheus-stack: Prometheus, Grafana, Alertmanager, node-exporter, and
# kube-state-metrics, bundled together as one Helm chart.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m   # this chart is large and slow to install cold; see the same reasoning in infrastructure/metallb.yaml
  dependsOn:
    - name: infrastructure
  path: ./clusters/kind/observability
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # wait: true so observability-config.yaml, which depends on this layer, only proceeds
  # once the ServiceMonitor CRD this chart installs actually exists and is being watched
  # by a running Prometheus, not just technically applied.
  wait: true
