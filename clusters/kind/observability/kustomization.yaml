# Plain Kustomize file for the observability layer: the namespace it runs in, where to
# pull the Helm chart from, and the HelmRelease itself with this project's tuning applied.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helm-repository.yaml
  - kube-prometheus-stack.yaml
