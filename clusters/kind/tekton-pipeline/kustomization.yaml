# Plain Kustomize file for the tekton-pipeline layer. git-credentials.yaml is
# SOPS-encrypted; git-clone.yaml is Tekton's own vendored catalog Task (not
# authored here, kept as published upstream). Everything else in this list is
# a manifest specific to this project.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - workspace-pvc.yaml
  - git-credentials.yaml
  - git-clone.yaml
  - maven-build.yaml
  - kaniko-build.yaml
  - pipeline.yaml
  - trigger-rbac.yaml
  - trigger-cronjob.yaml
