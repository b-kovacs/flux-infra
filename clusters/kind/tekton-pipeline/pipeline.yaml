apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-app
  namespace: default
spec:
  params:
    - name: repo-url
      type: string
    - name: image
      description: image repo WITHOUT a tag, e.g. registry-local:5000/demo-app
      type: string
  workspaces:
    - name: shared-data
  results:
    - name: image-tag
      description: the unique tag pushed by this run (chronologically sortable, for Flux image automation)
      value: $(tasks.fetch-source.results.committer-date)-$(tasks.fetch-source.results.commit)
  tasks:
    - name: fetch-source
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: shared-data
      params:
        - name: url
          value: $(params.repo-url)
    - name: maven-build
      runAfter: ["fetch-source"]
      taskRef:
        name: maven-build
      workspaces:
        - name: source
          workspace: shared-data
    - name: build-push
      runAfter: ["maven-build"]
      taskRef:
        name: kaniko-build
      workspaces:
        - name: source
          workspace: shared-data
      params:
        - name: IMAGE
          value: $(params.image):$(tasks.fetch-source.results.committer-date)-$(tasks.fetch-source.results.commit)
