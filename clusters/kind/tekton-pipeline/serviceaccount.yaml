# The identity every build-app PipelineRun actually runs as (see pipeline.yaml's
# taskRunTemplate.serviceAccountName, and trigger-cronjob.yaml which sets it explicitly on
# every PipelineRun it creates). Without pinning this, Tekton falls back to the
# namespace's plain "default" ServiceAccount, which has no credentials attached at all, so
# the git-clone step tries to negotiate authentication against GitHub for a public repo,
# and fails, rather than falling back to a plain anonymous clone. This bit exactly once
# during this build; see learning/04-solutions-reference.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-build
  namespace: default
# Attaching a Secret here isn't just about mounting it. Tekton specifically looks for
# Secrets attached to a TaskRun's ServiceAccount that are of type kubernetes.io/basic-auth
# or kubernetes.io/ssh-auth and carry a tekton.dev/git-0 (or docker-0) annotation, and
# turns them into a working .git-credentials file (or Docker config) automatically before
# any step runs. That's the whole mechanism: nothing in pipeline.yaml or git-clone.yaml
# wires this up explicitly, it happens purely because this ServiceAccount is the one the
# PipelineRun is told to use, and this Secret is the one attached to it. See
# git-credentials.yaml for the annotation that makes this work.
secrets:
  - name: git-credentials
