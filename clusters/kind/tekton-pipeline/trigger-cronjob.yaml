# Polls the app source repo for new commits and creates a PipelineRun when the tip
# changes. A real webhook is impossible here (GitHub can't reach a laptop behind WSL/NAT
# with no inbound path - see learning/02-what-went-badly.md), so this is the pull-based,
# WSL-friendly equivalent: outbound-only, no tunnel needed.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: build-trigger
  namespace: default
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: build-trigger
          restartPolicy: Never
          containers:
            - name: trigger
              image: alpine/k8s:1.29.0
              env:
                - name: GIT_USER
                  valueFrom:
                    secretKeyRef:
                      name: git-credentials
                      key: username
                - name: GIT_PASS
                  valueFrom:
                    secretKeyRef:
                      name: git-credentials
                      key: password
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  LATEST=$(git ls-remote "https://${GIT_USER}:${GIT_PASS}@github.com/b-kovacs/springboot-demo.git" refs/heads/main | cut -f1)
                  if [ -z "$LATEST" ]; then
                    echo "could not read remote HEAD (auth or network problem)" >&2
                    exit 1
                  fi
                  LAST=$(kubectl get configmap build-trigger-state -n default -o jsonpath='{.data.lastSha}' 2>/dev/null || true)
                  if [ -n "$LAST" ] && [ "$LATEST" = "$LAST" ]; then
                    echo "no change ($LATEST)"
                    exit 0
                  fi
                  # tekton-workspace is ONE fixed-name PVC reused by every PipelineRun (kept
                  # deliberately, for the Maven .m2 cache - see 04-solutions-reference.md).
                  # Two PipelineRuns running at once share that same directory with no
                  # mutual exclusion: the later run's git-clone cleanup step (cleandir())
                  # deletes pom.xml/src/target while the earlier run may still be reading
                  # them mid-build. This caused every unexplained build failure this
                  # project hit, traced back only after checking PipelineRun start/end
                  # timestamps for overlap - see the corrected twelfth lesson in
                  # learning/README.md. Skip this cycle rather than race a build already
                  # in flight; the next poll picks the same commit back up.
                  ACTIVE=$(kubectl get pipelinerun -n default -o json \
                    | jq -r '[.items[] | select(.spec.pipelineRef.name=="build-app") | select(.status.conditions[0].status=="Unknown")] | length')
                  if [ "$ACTIVE" -gt 0 ]; then
                    echo "a build-app run is already in progress - skipping this cycle to avoid a shared-workspace race"
                    exit 0
                  fi
                  echo "new commit: $LATEST (was: ${LAST:-none}) - triggering build"
                  kubectl create -f - <<PIPELINERUN
                  apiVersion: tekton.dev/v1
                  kind: PipelineRun
                  metadata:
                    generateName: build-app-run-
                    namespace: default
                  spec:
                    pipelineRef:
                      name: build-app
                    taskRunTemplate:
                      serviceAccountName: tekton-build
                    params:
                      - name: repo-url
                        value: https://github.com/b-kovacs/springboot-demo.git
                      - name: image
                        value: registry-local:5000/demo-app
                    workspaces:
                      - name: shared-data
                        persistentVolumeClaim:
                          claimName: tekton-workspace
                  PIPELINERUN
                  kubectl create configmap build-trigger-state -n default \
                    --from-literal=lastSha="$LATEST" --dry-run=client -o yaml | kubectl apply -f -
