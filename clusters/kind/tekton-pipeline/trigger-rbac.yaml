apiVersion: v1
kind: ServiceAccount
metadata:
  name: build-trigger
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: build-trigger
  namespace: default
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["build-trigger-state"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: build-trigger
  namespace: default
subjects:
  - kind: ServiceAccount
    name: build-trigger
    namespace: default
roleRef:
  kind: Role
  name: build-trigger
  apiGroup: rbac.authorization.k8s.io
